{% if messages %}
<div class="messages-container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">
            {{ message }}
            <button type="button" class="close-btn" onclick="this.parentElement.style.display='none';">&times;</button>
        </div>
    {% endfor %}
</div>
{% endif %}
