<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Luna - Sistema de Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/luna.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card" role="main" aria-label="Formulario de inicio de sesión">
            <div class="login-brand">
                <div class="logo">L</div>
                <div>
                    <h2 class="login-title">Luna</h2>
                    <div class="login-sub">Sistema de Gestión</div>
                </div>
            </div>

            <form class="login-form" method="POST" autocomplete="on">
                {% csrf_token %}

                <div class="form-group">
                    <label class="label" for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Nombre de usuario" required class="input">
                </div>

                <div class="form-group">
                    <label class="label" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required class="input">
                </div>

                <div class="login-actions">
                    <button type="submit" class="login-btn">Iniciar sesión</button>
                </div>
            </form>

            <div class="login-footer">© 2024 Luna - Sistema de Gestión. Todos los derechos reservados.</div>
        </div>

        {% if messages %}
        <div class="messages-container" role="status" aria-live="polite">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">
                    <span>{{ message }}</span>
                    <button type="button" class="close-btn" onclick="this.parentElement.style.display='none';">&times;</button>
                </div>
            {% endfor %}
        </div>
        {% endif %}

    </div>

    <!-- Minimal script for accessibility reductions (no heavy JS) -->
    <script>
        // Respect reduced motion preference for animations
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('reduced-motion');
        }
    </script>
</body>
</html>
